# /etc/nginx/sites-available/led-list
# Замените led-list.example.ru на свой домен и путь /var/www/led-list на путь до репозитория.
#
# ln -s /etc/nginx/sites-available/led-list /etc/nginx/sites-enabled/led-list
# nginx -t && systemctl reload nginx
# Затем: certbot --nginx -d led-list.example.ru   (выпустит TLS и допишет server{} для 443)

server {
    listen 80;
    server_name led-list.example.ru;

    # Собранный клиент: client/ && npm run build → client/dist
    root /var/www/led-list/client/dist;
    index index.html;

    client_max_body_size 25m;   # фото экранов до 20 МБ + запас

    # API — на процесс Node, слушающий только localhost (см. led-list-api.service)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # экспорт в PDF/Excel по полной выборке экранов может занять время
    }

    # Хэшированные ассеты сборки — кэшировать надолго
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA: неизвестные пути отдаём на index.html, React Router разберётся сам
    location / {
        try_files $uri /index.html;
    }
}
